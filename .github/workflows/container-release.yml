name: Publish container

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman

      - name: Install locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: "3.13.15"
          enable-cache: true

      - name: Validate release identity
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          project_version="$(
            uv run --locked python -c \
              'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])'
          )"
          if [[ "${RELEASE_TAG}" != "v${project_version}" ]]; then
            echo "error: release tag ${RELEASE_TAG} must equal v${project_version}" >&2
            exit 1
          fi

          revision="$(git rev-parse HEAD)"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${project_version}" >> "${GITHUB_OUTPUT}"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "version_ref=${image}:${project_version}" >> "${GITHUB_OUTPUT}"
          echo "commit_ref=${image}:sha-${revision}" >> "${GITHUB_OUTPUT}"

      - name: Audit Python source and dependencies
        run: make security

      - name: Run publishing checks
        env:
          ALKAHEST_IMAGE_VERSION: ${{ steps.release.outputs.version }}
          ALKAHEST_IMAGE_REVISION: ${{ steps.release.outputs.revision }}
        run: make ci

      - name: Verify image identity
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          source scripts/toolchain.sh
          actual_version="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.version" }}' \
              "${ALKAHEST_TOOLCHAIN_IMAGE}"
          )"
          actual_revision="$(
            podman image inspect \
              --format '{{ index .Labels "org.opencontainers.image.revision" }}' \
              "${ALKAHEST_TOOLCHAIN_IMAGE}"
          )"
          test "${actual_version}" = "${EXPECTED_VERSION}"
          test "${actual_revision}" = "${EXPECTED_REVISION}"

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" |
            podman login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push immutable image tags
        id: push
        env:
          VERSION_REF: ${{ steps.release.outputs.version_ref }}
          COMMIT_REF: ${{ steps.release.outputs.commit_ref }}
        run: |
          set -euo pipefail
          source scripts/toolchain.sh
          podman tag "${ALKAHEST_TOOLCHAIN_IMAGE}" "${VERSION_REF}"
          podman tag "${ALKAHEST_TOOLCHAIN_IMAGE}" "${COMMIT_REF}"
          podman push --digestfile /tmp/alkahest-image-digest "${VERSION_REF}"
          podman push "${COMMIT_REF}"

          digest="$(tr -d '\n' < /tmp/alkahest-image-digest)"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "error: registry returned an invalid image digest: ${digest}" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.release.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarize published image
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### Published Alkahest ${VERSION}"
            echo
            echo "- Image: \`${IMAGE}@${DIGEST}\`"
            echo "- Version tag: \`${VERSION}\`"
            echo "- Commit tag: \`sha-${REVISION}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
