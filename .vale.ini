StylesPath = .vale/styles
MinAlertLevel = suggestion

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Vale, Alkahest
Vale.Spelling = NO
Vale.Repetition = warning
# Quarto shortcodes and Pandoc math/reference tokens are source syntax, not prose.
TokenIgnores = (`[^`\n]+`\{=(?:latex|typst)\}), (\{\{[<%].*?[>%]\}\}), (\$+(?!\s)[^\n$]*?\S\$+), (\\\([^\n]*?\\\)), (@[-A-Za-z0-9_:.\/]+)
BlockIgnores = (?s)(```\{=(?:latex|typst)\}\n.*?\n```), (?s)(~~~\{=(?:latex|typst)\}\n.*?\n~~~), (?s)(\$\$.*?\$\$), (?s)(\\\[.*?\\\])

[book/**]
BasedOnStyles = Vale, Alkahest, AlkahestReferenceBook
Vale.Spelling = NO
