MinAlertLevel = suggestion

[formats]
qmd = md

[*.{md,qmd}]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Repetition = warning
# Quarto shortcodes and Pandoc math/reference tokens are source syntax, not prose.
TokenIgnores = (`[^`\n]+`\{=typst\}), (\{\{[<%].*?[>%]\}\}), (\{[^}\n]*\}), (\$+(?!\s)[^\n$]*?\S\$+), (\\\([^\n]*?\\\)), (@[-A-Za-z0-9_:.\/]+)
BlockIgnores = (?s)(```\{=typst\}\n.*?\n```), (?s)(~~~\{=typst\}\n.*?\n~~~), (?s)(\$\$.*?\$\$), (?s)(\\\[.*?\\\])
