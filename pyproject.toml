[project]
name = "alkahest-book-tools"
version = "0.2.0"
description = "Reusable tooling for the Alkahest technical-book publishing template"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = ["defusedxml>=0.7.1,<0.8"]

[project.scripts]
alkahest = "alkahest.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
test = [
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
]
quality = [
  "mypy>=1.18,<2",
  "ruff>=0.16,<0.17",
]
security = [
  "pip-audit>=2.10,<3",
]
diagrams = [
  "rdkit==2026.3.5",
  "schemdraw==0.23",
]
dev = [
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.uv]
required-version = "==0.12.5"
cache-dir = ".uv-cache"
default-groups = ["dev"]
exclude-newer = "2026-08-19T23:59:59Z"

[tool.uv.dependency-groups]
diagrams = { requires-python = "==3.13.*" }

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = ["locked: requires the pinned container or browser toolchain"]

[tool.coverage.run]
branch = true
source = ["alkahest"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
extend-select = ["B", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
files = [
  "src/alkahest/__main__.py",
  "src/alkahest/ci.py",
  "src/alkahest/cli.py",
  "src/alkahest/operations.py",
  "src/alkahest/project_checks.py",
  "src/alkahest/process.py",
  "src/alkahest/reporting.py",
  "src/alkahest/staging.py",
  "src/alkahest/tasks.py",
  "src/alkahest/checks/pdf_profiles.py",
  "src/alkahest/checks/suites.py",
  "src/alkahest/checks/writing.py",
  "src/alkahest/rendering/pipeline.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.uv.build-backend]
module-name = "alkahest"
module-root = "src"
