project:
  output-dir: _build/review/letter/latex

format:
  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - openright
    pdf-engine: lualatex
    keep-tex: true
    include-in-header: latex/book-layout.tex
    template-partials:
      - latex/title.tex
      - latex/before-body.tex
    geometry:
      - letterpaper
      - inner=1in
      - outer=1in
      - top=1in
      - bottom=1in
