project:
  output-dir: _build/review/letter/latex

format:
  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - openright
    pdf-engine: lualatex
    keep-tex: true
    toc: true
    number-sections: true
    geometry:
      - letterpaper
      - inner=1in
      - outer=1in
      - top=1in
      - bottom=1in
