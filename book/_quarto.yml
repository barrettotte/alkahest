project:
  type: book
  # Keep the authoring config compact by routing semantic validation through
  # one dispatcher, then stage generated vector and font build inputs.
  pre-render:
    - python3 ../scripts/sync-theme.py
    - python3 -m alkahest check --source
    - python3 -m alkahest.staging icons
    - python3 -m alkahest.staging webfonts

# Work-level values are generated from publication.json. This top-level include
# is inherited by every profile and by disposable edition staging projects.
metadata-files:
  - alkahest-defaults.yml
  - generated/theme-metadata.yml
  - generated/metadata.yml

book:
  chapters:
    - index.qmd
    - generated-lists.qmd
    - part: "Foundations"
      chapters:
        - reference.qmd
        - layout-stress.qmd
        - page-continuity.qmd
        - layout-acceptance.qmd
        - code-blocks.qmd
        - math.qmd
        - figures.qmd
        - components.qmd
        - learning.qmd
        - companion-materials.qmd
        - content-reuse.qmd
        - icons.qmd
        - glossary.qmd
    - references.qmd
    - glossary-backmatter.qmd
    - index-backmatter.qmd
  appendices:
    - part: "Production reference"
      chapters:
        - appendices/page-system-checklist.qmd
        - appendices/format-behavior.qmd
    - part: "Language reference"
      chapters:
        - appendices/language-and-script.qmd

# Authored presentation settings stay here; publication facts are generated
# into generated/metadata.yml from the canonical work and product records.
dedication: "For the readers who build things to understand them."

bibliography: references.bib
csl: citations/chicago-author-date.csl
# Keep intentionally uncited background works explicit and reviewable. The
# citation validator rejects every bibliography record that is neither cited
# in prose nor listed here.
nocite: |
  @shannon1948
