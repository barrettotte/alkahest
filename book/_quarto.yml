project:
  type: book
  # Keep the authoring config compact by routing semantic validation through
  # one dispatcher, then stage generated vector and font build inputs.
  pre-render:
    - python3 ../scripts/check-source.py
    - ../scripts/stage-icons.sh
    - ../scripts/stage-webfonts.sh

# Publication builds render source listings but never execute manuscript code
# or trust cached/frozen results. See execution-policy.json for the locked
# boundary and docs/quality.md for a future opt-in verifier design.
execute:
  enabled: false
  cache: false
  freeze: false

book:
  title: "Alkahest Reference Book"
  subtitle: "A feature specimen for a universal technical-book template"
  author: "Barrett Otte"
  chapters:
    - index.qmd
    - generated-lists.qmd
    - part: "Foundations"
      chapters:
        - reference.qmd
        - layout-stress.qmd
        - page-continuity.qmd
        - layout-acceptance.qmd
        - code-blocks.qmd
        - math.qmd
        - figures.qmd
        - components.qmd
        - learning.qmd
        - companion-materials.qmd
        - content-reuse.qmd
        - icons.qmd
        - glossary.qmd
    - references.qmd
    - glossary-backmatter.qmd
    - index-backmatter.qmd
  appendices:
    - part: "Production reference"
      chapters:
        - appendices/page-system-checklist.qmd
        - appendices/format-behavior.qmd
    - part: "Language reference"
      chapters:
        - appendices/language-and-script.qmd

# Shared front-matter fields are deliberately obvious specimen values. A real
# book or edition profile replaces them; no placeholder is a publication claim.
alkahest:
  edition: "Reference specimen (not for publication)"
  publisher: "[Publisher name]"
  copyright-year: "[Publication year]"
  copyright-holder: "[Rights holder]"
  rights-statement: "[Rights statement selected before publication]"
  identifier: "[ISBN or other publication identifier]"
  dedication: "For the readers who build things to understand them."
  notes:
    placement: footnotes

bibliography: references.bib
csl: citations/chicago-author-date.csl
# Keep intentionally uncited background works explicit and reviewable. The
# citation validator rejects every bibliography record that is neither cited
# in prose nor listed here.
nocite: |
  @shannon1948
lang: en-US
crossrefs-hover: true

# Let modern Babel import local span languages lazily in every LuaLaTeX
# profile. Pandoc otherwise passes embedded languages through the document
# class, triggering an incompatible legacy Greek/English module sequence.
babel-otherlangs: []

# H1 is the chapter title. Number and list sections (H2) and subsections (H3),
# while keeping detail headings (H4) visible but out of numbering and contents.
toc: true
toc-title: "Contents"
toc-depth: 3
number-sections: true
number-depth: 3
crossref:
  chapters: true

# Quarto 1.10 copies fig-alt onto both the image and its generated Div. Keep the
# valid image alternative and remove the invalid wrapper attribute late enough
# that cross-reference rendering is already complete.
filters:
  - _extensions/alkahest-notes/alkahest-notes-filter.lua
  - _extensions/alkahest-glossary/alkahest-glossary-filter.lua
  - _extensions/alkahest-index/alkahest-index-filter.lua
  - _extensions/alkahest-generated-lists/alkahest-generated-lists.lua
  - filters/math-alt.lua
  - at: post-render
    path: filters/strip-invalid-alt.lua

# One named stack feeds every output. HTML and EPUB package selected WOFF2
# faces; PDF backends resolve the matching locked OTF files.
mainfont: Libertinus Serif
displayfont: Libertinus Serif Display
sansfont: Libertinus Sans
mathfont: Libertinus Math
monofont: Source Code Pro
