project:
  type: book
  pre-render:
    - python3 -m alkahest.staging webfonts

metadata-files:
  - alkahest-defaults.yml

book:
  title: "Alkahest Reference Book"
  subtitle: "A compact feature specimen for a technical-book template"
  author: "Barrett Otte"
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - reference.qmd
        - code-blocks.qmd
        - math.qmd
        - figures.qmd
        - icons.qmd
        - glossary.qmd
    - references.qmd
    - glossary-backmatter.qmd
    - index-backmatter.qmd
  appendices:
    - appendices/page-system-checklist.qmd
    - appendices/format-behavior.qmd

# Reference-book metadata exercises the same fields exposed by book.toml.
dedication: "For the readers who build things to understand them."

bibliography: references.bib
lang: en-US
description: "A development specimen for the Alkahest author workflow."
identifier: "urn:uuid:f6757ec7-8201-46d2-8cda-584f28f8d8d8"
csl: citations/chicago-author-date.csl
# Keep intentionally uncited background works explicit and reviewable. The
# citation validator rejects every bibliography record that is neither cited
# in prose nor listed here.
nocite: |
  @shannon1948
