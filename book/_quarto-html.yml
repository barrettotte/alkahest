project:
  output-dir: _build/html
  resources:
    - theme/fonts/licenses
    # Rich playback stays a web enhancement. EPUB and PDF receive registered
    # SVG, description, and transcript fallbacks from the shortcode instead.
    - "media/**"

# Quarto 1.10.18 duplicates color-scheme link IDs when auto-applying Brand to a
# book. The Sass adapter consumes the same visible tokens until that is fixed.
brand: false

format:
  html:
    code-copy: true
    include-before-body: theme/accessibility-before-body.html
    # Interactive pages preserve source columns; print CSS still forces wrap.
    code-overflow: scroll
    # Native MathML keeps the web book semantic and independent of a CDN.
    html-math-method: mathml
    theme: theme/alkahest.scss
    css: theme/alkahest-fonts.css
