project:
  output-dir: _build/review/letter/typst

trim-width: 8.5in
trim-height: 11in
body-font-size: 10pt
body-leading: 3pt
paragraph-indent: 1em
paragraph-spacing: 3pt

format:
  typst:
    # Keep citation semantics identical to reflowable and LuaLaTeX outputs.
    citeproc: true
    keep-typ: true
    template-partials:
      - typst/typst-show.typ
    margin:
      top: 1in
      bottom: 1in
    margin-geometry:
      inner:
        far: 1in
        width: 0in
        separation: 0in
      outer:
        far: 1in
        width: 0in
        separation: 0in
      clearance: 8pt
