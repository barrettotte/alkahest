project:
  output-dir: _build/smoke/notes/sidenote/typst

alkahest:
  notes:
    placement: sidenotes

reference-location: margin

trim-width: 7in
trim-height: 10in
body-font-size: 10pt
body-leading: 3pt
paragraph-indent: 1em
paragraph-spacing: 3pt

format:
  typst:
    # Keep this smoke profile aligned with _quarto-typst.yml while reserving
    # an outer column wide enough for readable sidenotes.
    citeproc: true
    keep-typ: true
    template-partials:
      - typst/typst-show.typ
    margin:
      top: 0.70in
      bottom: 0.80in
    margin-geometry:
      inner:
        far: 0.85in
        width: 0in
        separation: 0in
      outer:
        far: 0.45in
        width: 1.35in
        separation: 0.15in
      clearance: 8pt
