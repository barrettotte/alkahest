project:
  output-dir: _build/print/7x10/typst

trim-width: 7in
trim-height: 10in
body-font-size: 10pt
body-leading: 3pt
paragraph-indent: 1em
paragraph-spacing: 3pt

format:
  typst:
    # Use the same CSL processor as HTML and EPUB.
    citeproc: true
    keep-typ: true
    template-partials:
      - typst/typst-show.typ
    margin:
      top: 0.70in
      bottom: 0.80in
    margin-geometry:
      inner:
        far: 0.85in
        width: 0in
        separation: 0in
      outer:
        far: 0.70in
        width: 0in
        separation: 0in
      clearance: 8pt
