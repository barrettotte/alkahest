project:
  output-dir: _build/smoke/pdf-accessibility/lualatex

format:
  pdf:
    # LaTeX's current tagged-PDF path targets PDF 2.0 and PDF/UA-2. Evaluate it
    # independently instead of changing the supported compatibility artifact.
    pdf-standard: ua-2
    # Tagged output needs one additional pass after the contents settles so
    # LaTeX's last-page hook can build a complete, non-duplicated ParentTree.
    latex-min-runs: 3
    # Plain code avoids the current fancyvrb/tagpdf stack imbalance and does
    # not encode syntax distinctions through color alone.
    highlight-style: none
