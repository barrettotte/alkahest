<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">One-second reference tone waveform</title>
  <desc id="desc">A regular sine wave oscillates around a horizontal center line. Labels identify a frequency of 440 hertz and duration of one second.</desc>
  <rect width="800" height="300" fill="#ffffff"/>
  <line x1="70" y1="150" x2="750" y2="150" stroke="#94a3b8" stroke-width="2"/>
  <line x1="70" y1="55" x2="70" y2="245" stroke="#111827" stroke-width="2"/>
  <path d="M70 150 C95 60 120 60 145 150 S195 240 220 150 S270 60 295 150 S345 240 370 150 S420 60 445 150 S495 240 520 150 S570 60 595 150 S645 240 670 150 S720 60 745 150" fill="none" stroke="#111827" stroke-width="5"/>
  <text x="400" y="38" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#111827">Reference tone</text>
  <text x="400" y="278" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#475569">440 Hz sine tone · duration 1.00 s · no speech</text>
</svg>
