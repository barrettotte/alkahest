<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Vector-component interactive fallback</title>
  <desc id="desc">A ten-unit vector at thirty-seven degrees has dashed horizontal and vertical projections labeled eight point zero and six point zero units.</desc>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#111827">Vector components at 37°</text>
  <line x1="120" y1="355" x2="710" y2="355" stroke="#111827" stroke-width="3"/>
  <line x1="120" y1="390" x2="120" y2="75" stroke="#111827" stroke-width="3"/>
  <line x1="120" y1="355" x2="560" y2="125" stroke="#111827" stroke-width="6"/>
  <path d="M535 120 L560 125 L548 147" fill="#111827"/>
  <line x1="120" y1="125" x2="560" y2="125" stroke="#475569" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="560" y1="355" x2="560" y2="125" stroke="#475569" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="340" y="105" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#111827">x = 8.0 units</text>
  <text x="585" y="245" font-family="sans-serif" font-size="24" fill="#111827">y = 6.0 units</text>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#475569">Static fallback records the default slider state and computed result.</text>
</svg>
