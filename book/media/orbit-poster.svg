<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Circular-orbit animation fallback</title>
  <desc id="desc">A small body is shown at four labeled positions on a dashed circular path around a central body. An arrow indicates counterclockwise motion.</desc>
  <rect width="800" height="450" fill="#ffffff"/>
  <text x="400" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#111827">Circular-orbit animation</text>
  <circle cx="400" cy="235" r="145" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="12 9"/>
  <circle cx="400" cy="235" r="30" fill="#111827"/>
  <g fill="#ffffff" stroke="#111827" stroke-width="5">
    <circle cx="400" cy="90" r="15"/>
    <circle cx="545" cy="235" r="15"/>
    <circle cx="400" cy="380" r="15"/>
    <circle cx="255" cy="235" r="15"/>
  </g>
  <path d="M520 150 A145 145 0 0 0 485 115" fill="none" stroke="#111827" stroke-width="5"/>
  <path d="M490 105 L480 125 L502 126" fill="#111827"/>
  <text x="575" y="155" font-family="sans-serif" font-size="22" fill="#475569">counterclockwise</text>
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#475569">Static fallback shows the complete path and representative positions.</text>
</svg>
