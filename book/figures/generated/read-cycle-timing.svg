<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Synchronous memory read cycle</title>
<desc id="desc">Four timing lanes show a clock, an active-high read signal, address 0x2A, and returned data 0xC7. The address becomes valid before the data.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
</marker>
</defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#111827">
<tspan x="500" dy="0">Synchronous memory read cycle</tspan>
</text>
<line x1="190" y1="75" x2="190" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="234.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="234.0" dy="0">0</tspan>
</text>
<line x1="278" y1="75" x2="278" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="322.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="322.0" dy="0">1</tspan>
</text>
<line x1="366" y1="75" x2="366" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="410.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="410.0" dy="0">2</tspan>
</text>
<line x1="454" y1="75" x2="454" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="498.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="498.0" dy="0">3</tspan>
</text>
<line x1="542" y1="75" x2="542" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="586.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="586.0" dy="0">4</tspan>
</text>
<line x1="630" y1="75" x2="630" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="674.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="674.0" dy="0">5</tspan>
</text>
<line x1="718" y1="75" x2="718" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="762.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="762.0" dy="0">6</tspan>
</text>
<line x1="806" y1="75" x2="806" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="850.0" y="430" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="850.0" dy="0">7</tspan>
</text>
<line x1="894" y1="75" x2="894" y2="402" stroke="#e2e8f0" stroke-width="1"/>
<text x="162" y="113" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="162" dy="0">CLK</tspan>
</text>
<polyline points="190,125 278,125 278,125 278,85 366,85 366,85 366,125 454,125 454,125 454,85 542,85 542,85 542,125 630,125 630,125 630,85 718,85 718,85 718,125 806,125 806,125 806,85 894,85" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<text x="162" y="189" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="162" dy="0">READ</tspan>
</text>
<polyline points="190,201 278,201 278,201 366,201 366,201 366,161 454,161 454,161 542,161 542,161 630,161 630,161 718,161 718,161 718,201 806,201 806,201 894,201" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<text x="162" y="265" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="162" dy="0">ADDR</tspan>
</text>
<line x1="190" y1="257" x2="894" y2="257" stroke="#475569" stroke-width="1" stroke-dasharray="6 5"/>
<polyline points="366,257 380,236 704,236 718,257 704,278 380,278 366,257" fill="#f8fafc" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<text x="542.0" y="264" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#111827">
<tspan x="542.0" dy="0">0x2A</tspan>
</text>
<text x="162" y="341" text-anchor="end" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="162" dy="0">DATA</tspan>
</text>
<line x1="190" y1="333" x2="894" y2="333" stroke="#475569" stroke-width="1" stroke-dasharray="6 5"/>
<polyline points="630,333 644,312 792,312 806,333 792,354 644,354 630,333" fill="#f8fafc" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<text x="718.0" y="340" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#111827">
<tspan x="718.0" dy="0">0xC7</tspan>
</text>
<line x1="366" y1="62" x2="366" y2="83" stroke="#111827" stroke-width="1" marker-end="url(#arrow)"/>
<text x="366" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#475569">
<tspan x="366" dy="0">address valid</tspan>
</text>
<line x1="630" y1="62" x2="630" y2="83" stroke="#111827" stroke-width="1" marker-end="url(#arrow)"/>
<text x="630" y="55" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="normal" fill="#475569">
<tspan x="630" dy="0">data valid</tspan>
</text>
<text x="500" y="456" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="500" dy="0">half-cycle slot</tspan>
</text>
</svg>
