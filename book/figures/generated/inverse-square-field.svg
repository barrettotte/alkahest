<text x="800" y="150" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#111827">Model</text>
<text x="800" y="185" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="normal" fill="#111827">g/g_ref = (r_ref/r)^2</text>
<text x="800" y="225" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="normal" fill="#111827">r_ref = 1.00 m</text>
<text x="800" y="260" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="normal" fill="#111827">grid = 1.00 m</text>
<text x="800" y="295" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="normal" fill="#111827">exclude r &lt;= 0.50 m</text>
