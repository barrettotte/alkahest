<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="225.19999999999996pt" width="285.19399999999996pt" viewBox="-75.87999999999998 -194.68 285.19399999999996 225.19999999999996" role="img" aria-labelledby="title desc">
<title id="title">Nine-volt resistive voltage divider</title>
<desc id="desc">A 9 volt DC source feeds a 1 kilohm upper resistor and a 2 kilohm lower resistor in series. The output node is between the resistors, and the lower rail returns to ground and the negative source terminal.</desc><circle cx="0" cy="-93.6" r="18" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;" /><path d="M 0.0,-0.0 L 0,-75.6 L 0,-75.6 M 0,-111.6 L 0,-111.6 L 0,-187.2" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 3.600000000000005,-84.60000000000001 L -3.6,-84.6" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 6.0620016557793985e-15,-99.0 L 0,-106.2" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 3.6000000000000068,-102.60000000000001 L -3.6,-102.6" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 1.1462694040019228e-14,-187.20000000000002 L 64.8,-187.2 L 129.6,-187.2" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 129.60000000000002,-187.20000000000002 L 129.6,-158.4 L 138.6,-158.4 L 138.6,-122.4 L 120.6,-122.4 L 120.6,-158.4 L 129.6,-158.4 M 129.6,-122.4 L 129.6,-93.6" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 129.6,-93.60000000000001 L 129.6,-64.8 L 138.6,-64.8 L 138.6,-28.8 L 120.6,-28.8 L 120.6,-64.8 L 129.6,-64.8 M 129.6,-28.8 L 129.6,-0" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 129.6,-0.0 L 64.8,-0 L 0,-0" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 0.0,-1.5871422516949695e-14 L 0,14.4 L -9,14.4 L 9,14.4 M -6.3,18.72 L 6.3,18.72 M -1.8,23.04 L 1.8,23.04" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 144.0,-165.60000000000002 L 144,-104.4" style="stroke:#111827;fill:none;stroke-width:1.7;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 144 -174.4 L 147.6 -165.6 L 140.4 -165.6 Z" style="stroke:#111827;fill:#111827;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="-21.599999999999994" y="-106.60000000000001" dominant-baseline="central" fill="#111827" font-size="13" font-family="Libertinus Sans" text-anchor="end"><tspan x="-21.599999999999994" dy="13">Vₛ = 9 V</tspan></text><text x="117.00000000000001" y="-153.4" dominant-baseline="central" fill="#111827" font-size="13" font-family="Libertinus Sans" text-anchor="end"><tspan x="117.00000000000001" dy="13">R₁ = 1 kΩ</tspan></text><text x="117.0" y="-59.800000000000004" dominant-baseline="central" fill="#111827" font-size="13" font-family="Libertinus Sans" text-anchor="end"><tspan x="117.0" dy="13">R₂ = 2 kΩ</tspan></text><text x="154.79999999999998" y="-153.4" dominant-baseline="central" fill="#111827" font-size="13" font-family="Libertinus Sans" text-anchor="start"><tspan x="154.79999999999998" dy="13">I = 3 mA</tspan></text><circle cx="129.6" cy="-93.6" r="2.7" style="stroke:#111827;fill:#111827;stroke-width:1.7;stroke-dasharray:-;" /><text x="135.9" y="-106.60000000000001" dominant-baseline="central" fill="#111827" font-size="13" font-family="Libertinus Sans" text-anchor="start"><tspan x="135.9" dy="13">Vout = 6 V</tspan></text></svg>
