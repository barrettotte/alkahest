<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Half-adder gate network</title>
<desc id="desc">Inputs A and B each branch to an XOR gate producing SUM and an AND gate producing CARRY.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
</marker>
</defs>
<rect width="1000" height="390" fill="#ffffff"/>
<text x="500" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#111827">
<tspan x="500" dy="0">Half-adder gate network</tspan>
</text>
<text x="70" y="127" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111827">
<tspan x="70" dy="0">A</tspan>
</text>
<line x1="95" y1="120" x2="250" y2="120" stroke="#111827" stroke-width="3"/>
<circle cx="250" cy="120" r="5" fill="#111827"/>
<text x="70" y="277" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#111827">
<tspan x="70" dy="0">B</tspan>
</text>
<line x1="95" y1="270" x2="250" y2="270" stroke="#111827" stroke-width="3"/>
<circle cx="250" cy="270" r="5" fill="#111827"/>
<polyline points="250,120 330,120 330,115 415,115" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<polyline points="250,120 295,120 295,235 420,235" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<polyline points="250,270 330,270 330,165 415,165" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<polyline points="250,270 295,270 295,285 420,285" fill="none" stroke="#111827" stroke-width="2" stroke-linejoin="round"/>
<path d="M 430 88 Q 505 88 560 140 Q 505 192 430 192 Q 458 140 430 88 Z" fill="#f8fafc" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<path d="M 418 88 Q 446 140 418 192" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<text x="490" y="147" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">
<tspan x="490" dy="0">XOR</tspan>
</text>
<line x1="560" y1="140" x2="850" y2="140" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<text x="890" y="147" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">
<tspan x="890" dy="0">SUM</tspan>
</text>
<path d="M 430 215 L 480 215 A 55 55 0 0 1 480 325 L 430 325 Z" fill="#f8fafc" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<text x="480" y="277" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111827">
<tspan x="480" dy="0">AND</tspan>
</text>
<line x1="535" y1="270" x2="850" y2="270" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
<text x="900" y="277" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">
<tspan x="900" dy="0">CARRY</tspan>
</text>
</svg>
