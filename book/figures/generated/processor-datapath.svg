<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Minimal processor datapath</title>
<desc id="desc">A program counter addresses instruction memory. Instruction fields feed decode and the register file; control selects registers and the ALU operation. The ALU accesses data memory, with load data and next-PC feedback paths.</desc>
