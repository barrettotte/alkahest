<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Memory map and instruction word</title>
<desc id="desc">A sixteen-bit address space is divided into four equal regions: ROM, RAM, reserved space, and memory-mapped input/output. A sixteen-bit instruction is divided into opcode, mode, destination, source, and immediate fields.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
</marker>
</defs>
<rect width="1000" height="540" fill="#ffffff"/>
<text x="500" y="40" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#111827">
<tspan x="500" dy="0">Memory map and instruction word</tspan>
</text>
<text x="245" y="82" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">
<tspan x="245" dy="0">16-bit address space</tspan>
</text>
<rect x="120" y="105" width="270" height="78" rx="0" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="255.0" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">
<tspan x="255.0" dy="0">16 KiB ROM</tspan>
</text>
<text x="255.0" y="166" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#475569">
<tspan x="255.0" dy="0">0x0000–0x3FFF</tspan>
</text>
<rect x="120" y="183" width="270" height="78" rx="0" fill="#eef2f7" stroke="#111827" stroke-width="2"/>
<text x="255.0" y="218" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">
<tspan x="255.0" dy="0">16 KiB RAM</tspan>
</text>
<text x="255.0" y="244" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#475569">
<tspan x="255.0" dy="0">0x4000–0x7FFF</tspan>
</text>
<rect x="120" y="261" width="270" height="78" rx="0" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="255.0" y="296" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">
<tspan x="255.0" dy="0">Reserved</tspan>
</text>
<text x="255.0" y="322" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#475569">
<tspan x="255.0" dy="0">0x8000–0xBFFF</tspan>
</text>
<rect x="120" y="339" width="270" height="78" rx="0" fill="#eef2f7" stroke="#111827" stroke-width="2"/>
<text x="255.0" y="374" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#111827">
<tspan x="255.0" dy="0">Memory-mapped I/O</tspan>
</text>
<text x="255.0" y="400" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="normal" fill="#475569">
<tspan x="255.0" dy="0">0xC000–0xFFFF</tspan>
</text>
<text x="720" y="120" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#111827">
<tspan x="720" dy="0">16-bit instruction word</tspan>
</text>
<rect x="495" y="165" width="112.5" height="105" rx="0" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="551.25" y="213" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="551.25" dy="0">opcode</tspan>
</text>
<text x="551.25" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#475569">
<tspan x="551.25" dy="0">15:12</tspan>
</text>
<rect x="607.5" y="165" width="56.25" height="105" rx="0" fill="#eef2f7" stroke="#111827" stroke-width="2"/>
<text x="635.625" y="213" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="635.625" dy="0">mode</tspan>
</text>
<text x="635.625" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#475569">
<tspan x="635.625" dy="0">11:10</tspan>
</text>
<rect x="663.75" y="165" width="84.375" height="105" rx="0" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="705.9375" y="213" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="705.9375" dy="0">rd</tspan>
</text>
<text x="705.9375" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#475569">
<tspan x="705.9375" dy="0">9:7</tspan>
</text>
<rect x="748.125" y="165" width="84.375" height="105" rx="0" fill="#eef2f7" stroke="#111827" stroke-width="2"/>
<text x="790.3125" y="213" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="790.3125" dy="0">rs</tspan>
</text>
<text x="790.3125" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#475569">
<tspan x="790.3125" dy="0">6:4</tspan>
</text>
<rect x="832.5" y="165" width="112.5" height="105" rx="0" fill="#f8fafc" stroke="#111827" stroke-width="2"/>
<text x="888.75" y="213" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111827">
<tspan x="888.75" dy="0">immediate</tspan>
</text>
<text x="888.75" y="244" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="normal" fill="#475569">
<tspan x="888.75" dy="0">3:0</tspan>
</text>
<text x="720" y="310" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="normal" fill="#475569">
<tspan x="720" dy="0">field width follows bit count</tspan>
</text>
<text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="normal" fill="#475569">
<tspan x="500" dy="0">Addresses and bit positions are explicit; area carries no semantic meaning alone.</tspan>
</text>
</svg>
