<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">System overview optimized for monochrome print</title>
  <desc id="desc">Four labeled modules form a loop: observe, model, decide, and act. Distinct border patterns identify stages; solid arrows show the primary path and a dashed arrow shows feedback.</desc>
  <defs>
    <marker id="print-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#20262e"/></marker>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.8" fill="#94a3b8"/></pattern>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="14" stroke="#94a3b8" stroke-width="3"/></pattern>
  </defs>
  <rect width="1400" height="560" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <text x="700" y="70" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#20262e">Closed-loop technical system</text>
  <text x="1320" y="68" text-anchor="end" font-family="sans-serif" font-size="18" fill="#475569">print edition</text>
  <g font-family="sans-serif" text-anchor="middle" fill="#20262e">
    <g><rect x="80" y="170" width="270" height="155" rx="24" fill="url(#dots)" stroke="#20262e" stroke-width="5"/><rect x="91" y="181" width="248" height="133" rx="16" fill="#ffffff"/><text x="215" y="235" font-size="33" font-weight="700">1. Observe</text><text x="215" y="278" font-size="23" fill="#475569">measure the world</text></g>
    <g><rect x="405" y="170" width="270" height="155" rx="24" fill="#f1f5f9" stroke="#20262e" stroke-width="5" stroke-dasharray="18 8"/><text x="540" y="235" font-size="33" font-weight="700">2. Model</text><text x="540" y="278" font-size="23" fill="#475569">estimate state</text></g>
    <g><rect x="730" y="170" width="270" height="155" rx="24" fill="url(#hatch)" stroke="#20262e" stroke-width="5"/><rect x="741" y="181" width="248" height="133" rx="16" fill="#ffffff" fill-opacity="0.9"/><text x="865" y="235" font-size="33" font-weight="700">3. Decide</text><text x="865" y="278" font-size="23" fill="#475569">select an action</text></g>
    <g><rect x="1055" y="170" width="270" height="155" rx="24" fill="#ffffff" stroke="#20262e" stroke-width="9"/><text x="1190" y="235" font-size="33" font-weight="700">4. Act</text><text x="1190" y="278" font-size="23" fill="#475569">change the system</text></g>
  </g>
  <g fill="none" stroke="#20262e" stroke-width="7" marker-end="url(#print-arrow)">
    <path d="M 360 248 H 390"/><path d="M 685 248 H 715"/><path d="M 1010 248 H 1040"/>
    <path d="M 1190 345 C 1190 475, 215 475, 215 345" stroke-dasharray="18 12"/>
  </g>
  <text x="700" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#475569">feedback updates the next observation</text>
</svg>
