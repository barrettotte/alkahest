<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Raw sampled waveform</title>
  <desc id="desc">A jagged signal varies around a smooth trend and contains several sharp noise peaks.</desc>
  <rect width="640" height="400" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <path d="M 80 70 V 330 M 80 330 H 585" stroke="#334155" stroke-width="4"/>
    <path d="M 80 135 H 585 M 80 200 H 585 M 80 265 H 585" stroke-dasharray="8 8"/>
    <path d="M 180 70 V 330 M 280 70 V 330 M 380 70 V 330 M 480 70 V 330" stroke-dasharray="8 8"/>
  </g>
  <polyline points="80,248 105,225 130,240 155,202 180,220 205,168 230,195 255,112 280,176 305,139 330,166 355,105 380,154 405,132 430,183 455,150 480,218 505,197 530,255 555,230 585,266" fill="none" stroke="#9a4f12" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#9a4f12">
    <circle cx="255" cy="112" r="8"/><circle cx="355" cy="105" r="8"/><circle cx="585" cy="266" r="8"/>
  </g>
  <g font-family="sans-serif" fill="#334155">
    <text x="332" y="372" text-anchor="middle" font-size="24">time</text>
    <text x="30" y="200" text-anchor="middle" font-size="24" transform="rotate(-90 30 200)">amplitude</text>
  </g>
</svg>
