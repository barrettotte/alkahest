<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Three-stage signal chain</title>
  <desc id="desc">A sensor feeds signal conditioning, which feeds a decision stage, with labeled arrows between stages.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
  <text x="600" y="64" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#20262e">A portable measurement path</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="85" y="125" width="270" height="175" rx="20" fill="#f1f5f9" stroke="#334155" stroke-width="5"/>
    <circle cx="220" cy="178" r="28" fill="#ffffff" stroke="#9a4f12" stroke-width="6"/>
    <path d="M 198 178 C 207 153, 233 203, 242 178" fill="none" stroke="#9a4f12" stroke-width="5"/>
    <text x="220" y="250" font-size="31" font-weight="700" fill="#334155">Sensor</text>
    <text x="220" y="282" font-size="22" fill="#64748b">physical quantity</text>

    <rect x="465" y="125" width="270" height="175" rx="20" fill="#f1f5f9" stroke="#334155" stroke-width="5"/>
    <path d="M 520 194 L 556 194 L 574 160 L 610 229 L 628 194 L 680 194" fill="none" stroke="#9a4f12" stroke-width="6" stroke-linejoin="round"/>
    <text x="600" y="250" font-size="31" font-weight="700" fill="#334155">Conditioning</text>
    <text x="600" y="282" font-size="22" fill="#64748b">filter and scale</text>

    <rect x="845" y="125" width="270" height="175" rx="20" fill="#f1f5f9" stroke="#334155" stroke-width="5"/>
    <path d="M 950 178 L 980 208 L 1024 158" fill="none" stroke="#9a4f12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="980" y="250" font-size="31" font-weight="700" fill="#334155">Decision</text>
    <text x="980" y="282" font-size="22" fill="#64748b">record or respond</text>

    <line x1="365" y1="212" x2="448" y2="212" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
    <line x1="745" y1="212" x2="828" y2="212" stroke="#334155" stroke-width="6" marker-end="url(#arrow)"/>
    <text x="406" y="190" font-size="20" fill="#64748b">analog</text>
    <text x="786" y="190" font-size="20" fill="#64748b">normalized</text>
  </g>
  <text x="600" y="365" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#64748b">Meaning is conveyed by labels and shape, not color alone.</text>
</svg>
