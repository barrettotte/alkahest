<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">System overview optimized for screens</title>
  <desc id="desc">Four labeled modules form a loop: observe, model, decide, and act. Solid arrows show the primary path and a dashed arrow shows feedback.</desc>
  <defs>
    <marker id="screen-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <linearGradient id="screen-band" x1="0" x2="1"><stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  </defs>
  <rect width="1400" height="560" rx="24" fill="url(#screen-band)" stroke="#cbd5e1" stroke-width="4"/>
  <text x="700" y="70" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#20262e">Closed-loop technical system</text>
  <text x="1320" y="68" text-anchor="end" font-family="sans-serif" font-size="18" fill="#64748b">screen edition</text>
  <g font-family="sans-serif" text-anchor="middle">
    <g><rect x="80" y="170" width="270" height="155" rx="24" fill="#ffffff" stroke="#287c72" stroke-width="7"/><text x="215" y="235" font-size="33" font-weight="700" fill="#334155">1. Observe</text><text x="215" y="278" font-size="23" fill="#64748b">measure the world</text></g>
    <g><rect x="405" y="170" width="270" height="155" rx="24" fill="#ffffff" stroke="#536ea3" stroke-width="7"/><text x="540" y="235" font-size="33" font-weight="700" fill="#334155">2. Model</text><text x="540" y="278" font-size="23" fill="#64748b">estimate state</text></g>
    <g><rect x="730" y="170" width="270" height="155" rx="24" fill="#ffffff" stroke="#9a4f12" stroke-width="7"/><text x="865" y="235" font-size="33" font-weight="700" fill="#334155">3. Decide</text><text x="865" y="278" font-size="23" fill="#64748b">select an action</text></g>
    <g><rect x="1055" y="170" width="270" height="155" rx="24" fill="#ffffff" stroke="#80558c" stroke-width="7"/><text x="1190" y="235" font-size="33" font-weight="700" fill="#334155">4. Act</text><text x="1190" y="278" font-size="23" fill="#64748b">change the system</text></g>
  </g>
  <g fill="none" stroke="#334155" stroke-width="7" marker-end="url(#screen-arrow)">
    <path d="M 360 248 H 390"/><path d="M 685 248 H 715"/><path d="M 1010 248 H 1040"/>
    <path d="M 1190 345 C 1190 475, 215 475, 215 345" stroke-dasharray="18 12"/>
  </g>
  <text x="700" y="520" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#64748b">feedback updates the next observation</text>
</svg>
